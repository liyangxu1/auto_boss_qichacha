[project]
name = "auto-boss-qichacha"
version = "0.1.0"
description = "Auto Boss Zhipin job search based on resume analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.30.0",
    "PyPDF2>=3.0.0",
    "beautifulsoup4>=4.12.0"
]

[tool.setuptools.packages.find]
include = ["modules*"]
exclude = ["tests*", "data*", "config*"]
